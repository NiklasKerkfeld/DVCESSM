##########################
# Setup.py Configuration #
##########################
[metadata]
name = Diffusion Visual Counterfactuals for Segmentation Models
version = 0.9
description = Counterfactual generation using Diffusion Models
long_description = file: README.md
long_description_content_type = text/markdown
author = Niklas Kerkfeld
license = EUROPEAN UNION PUBLIC LICENCE
license_files = LICENSE
keywords =
    Deep Learning
    Explainable AI
    Counterfactuals
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Science/Research
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
install_requires =
    torch>=2.0.0
    torchvision>=0.15.0
    omegaconf>=2.3.0
    hydra-core>=1.3.2
    tensorboard>=2.12.0
    matplotlib>=3.7.0
    monai>=1.5.2
    numpy>=1.24.0
    pytest>=7.0.0
    pandas>=1.5.2
    scikit-learn>=1.2.0
    tqdm>=4.65.0

python_requires = >=3.10

packages = find:
package_dir =
    = src

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest
    mypy
    pylint
    nox

[mypy]
mypy_path = src
explicit_package_bases = true
ignore_missing_imports = true

[tool:pytest]
pythonpath = .
testpaths = tests

[pylint.MESSAGES CONTROL]
disable =
    too-many-instance-attributes,
    too-many-arguments,
    too-many-positional-arguments,
    too-few-public-methods,
    not-callable

[pylint.DESIGN]
max-args = 10
max-positional-arguments = 8
max-attributes = 35
max-locals = 30
max-statements = 75

[pylint.TYPECHECK]
generated-members = torch.*, torch.nn.functional.*