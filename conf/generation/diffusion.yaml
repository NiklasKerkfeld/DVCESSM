defaults:
  - base
  - distance_loss: log_distance

type: Diffusion
start_fraction: 0.5
approximation_step_size: 100
weight_segmentation: 0.15
weight_distance: 0.5

GradSmoothing:
  _target_: src.diff_cf.core.diffusion.generator.GradSmoothingConfig
  spacial_gradient_smoothing: true
  temporal_gradient_smoothing: true
  filter_gradients: true
  percentile: 0.8
  distance_reduction: 0.75
  alpha: 0.9
  max_sigma: 2.5