defaults:
  - base
  - DistanceLoss: log_distance

type: Diffusion
seed: 42
start_fraction: 0.5
approximation_step_size: 100
weight_segmentation: 0.15
weight_distance: 0.15
robust: null
cone_projection_alpha: 0.471238898

GradSmoothing:
  _target_: src.core.diffusion.generator.GradSmoothingConfig
  spacial_gradient_smoothing: true
  temporal_gradient_smoothing: true
  filter_gradients: true
  percentile: 0.9
  alpha: 0.99
  max_sigma: 2.5