defaults:
  - data: BraTS
  - engine: linear
  - _self_

diffusion:
  checkpoint_path: "./checkpoints/Diffusion"
  name: null
  epochs: 250
  lr: 3e-4
  ema_decay: 0.999
  time_dim: 256

generation:
  name: null
  sample_idx: ???
  start_fraction: 0.5 # noise level for CF generation
  weight_segmentation: 0.15
  weight_distance: 0.15
  AdaptGrad:
    N: 1
    c: .99

segmentation:
  checkpoint_path: "./checkpoints/Segmentation"
  name: null
  epochs: 100
  lr: 0.001
  attention: True
  robust:
    use: True
    alpha: null
    epsilon: 30.0
    steps: 10
    start_epoch: 10
    warm_up: 10

system:
  log_dir: "./runs"
  figures_dir: "./figures"
  evaluation_dir: "./evaluation"