defaults:
  - data: celebamask
  - engine: linear
  - generation: Diffusion
  - _self_

diffusion:
  checkpoint_path: "./checkpoints/Diffusion"
  name: null
  epochs: 250
  lr: 3e-4
  gamma: 5.0
  warm_up: 500
  ema_decay: 0.999
  time_dim: 256
  use_target: False

segmentation:
  checkpoint_path: "./checkpoints/Segmentation"
  name: null
  epochs: 100
  lr: 0.001
  attention: True
  ood: null
  use_augmentations: False
  robust:
    use: True
    alpha: null
    epsilon: 30.0
    steps: 10
    start_epoch: 10
    warm_up: 10

system:
  log_dir: "./runs"
  figures_dir: "./figures"
  evaluation_dir: "./evaluation"