defaults:
  - _self_


data:
  name: BraTS
  root: data/BraTS
  image_channels: 4
  n_classes: 5
  image_width: 128
  image_height: 128
  batch_size: 64
  num_workers: 8  # Number of CPU cores for data loading


diffusion:
  checkpoint_path: "./checkpoints/Diffusion"
  name: null
  epochs: 250
  lr: 3e-4
  time_dim: 256
  start_fraction: 0.5 # noise level for CF generation
  weight_classifier: 0.1
  weight_distance: 0.15
  engine: linear


segmentation:
  checkpoint_path: "./checkpoints/Segmentation"
  name: null
  epochs: 25
  lr: 0.001

gan:
  checkpoint_path: "./checkpoints/GAN"
  name: null
  segmentation_model: ???
  epochs: 60
  lr_generator: 0.002
  lr_adversarial: 0.0004
  lambda_adv: 1.0
  lambda_seg: 10.0
  lambda_adpt: 1.0
  lambda_per: 0.01

system:
  log_dir: "./runs"
  figures_dir: "./figures"
  evaluation_dir: "./evaluation"