defaults:
  - data: BraTS
  - engine: linear
  - _self_

diffusion:
  checkpoint_path: "./checkpoints/Diffusion"
  name: null
  epochs: 250
  lr: 3e-4
  ema_decay: 0.999
  time_dim: 256
  sample_idx: ???
  start_fraction: 0.5 # noise level for CF generation
  weight_classifier: 2.5
  weight_distance: 0.5
  AdaptGrad:
    N: 1
    c: .99999


segmentation:
  checkpoint_path: "./checkpoints/Segmentation"
  name: null
  epochs: 100
  lr: 0.001
  attention: True

gan:
  checkpoint_path: "./checkpoints/GAN"
  name: null
  segmentation_model: ???
  epochs: 60
  lr_generator: 0.02
  lr_adversarial: 0.004
  lambda_adv: 1.0
  lambda_seg: 1.0
  lambda_rec: 0.1
  lambda_per: 0.01
  free_rec: 0.1
  free_per: 0.1

system:
  log_dir: "./runs"
  figures_dir: "./figures"
  evaluation_dir: "./evaluation"