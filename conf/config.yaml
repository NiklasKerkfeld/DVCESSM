defaults:
  - data: BraTS
  - engine: linear
  - _self_

diffusion:
  checkpoint_path: "./checkpoints/Diffusion"
  name: null
  epochs: 250
  lr: 3e-4
  ema_decay: 0.999
  time_dim: 256

generation:
  name: null
  sample_idx: ???
  start_fraction: 0.75 # noise level for CF generation
  weight_classifier: 3.0
  weight_distance: 0.5
  AdaptGrad:
    N: 32
    c: .99999

segmentation:
  checkpoint_path: "./checkpoints/Segmentation"
  name: null
  epochs: 100
  lr: 0.001
  attention: True
  robust:
    use: True
    alpha: 0.1
    epsilon: 0.5
    steps: 10
    start_epoch: 10
    warm_up: 10

system:
  log_dir: "./runs"
  figures_dir: "./figures"
  evaluation_dir: "./evaluation"